title: Suspicious PowerShell Download Activity
id: 6d42989e-8b1a-4b4e-0002-000000000002
status: test
description: Detects PowerShell processes that download or execute content from the network.
author: Graph-ADAPT Benchmark Corpus
date: 2026/11/25
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - 'Invoke-WebRequest'
      - 'DownloadString'
  condition: selection
falsepositives:
  - Software deployment and update automation
level: high
tags:
  - attack.execution
  - attack.t1059.001
