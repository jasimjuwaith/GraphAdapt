title: Microsoft Defender Tampering
id: 6d42989e-8b1a-4b4e-0004-000000000004
status: test
description: Detects attempts to disable or modify Microsoft Defender settings.
author: Graph-ADAPT Benchmark Corpus
date: 2026/11/25
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'DisableRealtimeMonitoring'
  condition: selection
falsepositives:
  - Authorized endpoint administration
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.001
